name: Docker Build and Push

on:
    push:
        branches:
            - main
            - latest
        tags:
            - "v[0-9]*"

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        if: github.repository == 'moodlehq/moodleapp'
        steps:
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Calculate Docker Tags
              id: meta
              run: |
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    # Strips leading 'v' (e.g., v4.3.0 -> 4.3.0)
                    TAGNAME="${GITHUB_REF_NAME#v}"
                  elif [[ "${{ github.ref_name }}" == "main" ]]; then
                    TAGNAME="next"
                  elif [[ "${{ github.ref_name }}" == "latest" ]]; then
                    TAGNAME="latest"
                  fi

                  echo "tagname=${TAGNAME}" >> $GITHUB_OUTPUT
                  echo "${TAGNAME}, ${TAGNAME}-dev, ${TAGNAME}-test" >> $GITHUB_STEP_SUMMARY

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push production image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ github.repository }}:${{ steps.meta.outputs.tagname }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push dev image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ github.repository }}:${{ steps.meta.outputs.tagname }}-dev
                  build-args: build_command=npm run build
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push test image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ github.repository }}:${{ steps.meta.outputs.tagname }}-test
                  build-args: build_command=npm run build:test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
